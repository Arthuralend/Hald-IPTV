name: Build Android TV

on:
  push:
    branches: [main]
    paths: ['android/**', 'tools/gen_logo_index.py', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Signing key (kept in the Actions cache, never in the repo)
        uses: actions/cache@v4
        with:
          path: ~/.iptv-keystore
          key: iptv-tv-keystore-v1
      - name: Create key if missing
        run: |
          mkdir -p ~/.iptv-keystore
          if [ ! -f ~/.iptv-keystore/release.jks ]; then
            openssl rand -hex 16 > ~/.iptv-keystore/pass
            P=$(cat ~/.iptv-keystore/pass)
            keytool -genkeypair -keystore ~/.iptv-keystore/release.jks -storepass "$P" -keypass "$P" \
              -alias iptv -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=IPTV Pro Max"
          fi
          P=$(cat ~/.iptv-keystore/pass)
          echo "::add-mask::$P"
          echo "KEYSTORE_FILE=$HOME/.iptv-keystore/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$P" >> "$GITHUB_ENV"
      - name: Refresh logo index (iptv-org)
        run: python3 tools/gen_logo_index.py || echo "using bundled index"
      - name: Build APK
        working-directory: android
        run: gradle assembleTvRelease assembleMobileRelease --no-daemon --stacktrace -q
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/tv/release/app-tv-release.apk IPTV-Pro-Max-TV.apk
          cp android/app/build/outputs/apk/mobile/release/app-mobile-release.apk TV-Mobile.apk
          gh release view android -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create android -R "${{ github.repository }}" --title "IPTV Pro Max — Android TV" \
              --notes "APK для Android TV" --latest=false
          gh release upload android IPTV-Pro-Max-TV.apk TV-Mobile.apk -R "${{ github.repository }}" --clobber
          gh release edit android -R "${{ github.repository }}" --latest=false \
            --notes "IPTV-Pro-Max-TV.apk — Android TV; TV-Mobile.apk — телефон и планшет. Сборка ${{ github.run_number }} ($(date -u +%Y-%m-%d))"
